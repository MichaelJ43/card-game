# Dependabot version updates and security advisories for npm (site + lambda).
# See docs/features/security-automation.md for how PRs are triaged and merged.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /lambda
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: deps(lambda)
